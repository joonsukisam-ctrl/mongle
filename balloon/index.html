<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8fd88a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<body>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>몽글 물풍선</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* 한 화면 게임: 가운데 칸 지도, 왼쪽 아래 방향 패드, 오른쪽 아래 물풍선 버튼 (가로 화면 기준) */
:root{
  --sky:#a8e6a1; --cream:#fffaf0; --ink:#4a3b5c; --pink:#ff8fb1; --mint:#6fe0b8;
  --sun:#ffd34d; --grape:#9b8cff; --soft:#efe6fb; --water:#4fb0ff; --pb:46px;
  --font:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important;}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);}
body{font-family:var(--font);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-tap-highlight-color:transparent;}
button{font-family:var(--font);color:var(--ink);cursor:pointer;}
button:focus-visible,input:focus-visible{outline:3px solid var(--grape);outline-offset:2px;}
#app{position:fixed;inset:0;}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;}
.icon-btn{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:50%;border:0;
  background:rgba(255,250,240,.93);box-shadow:0 3px 0 rgba(74,59,92,.16);font-size:18px;}

/* 아래쪽 조작 */
body.in-menu .controls,body.in-menu #menuBtn{display:none;}
body:not(.can-move) .controls{opacity:.35;pointer-events:none;}
.pad{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));
  display:grid;grid-template-columns:repeat(3,var(--pb));grid-template-rows:repeat(3,var(--pb));gap:3px;touch-action:none;}
.btn{border:0;border-radius:16px;background:rgba(255,250,240,.9);box-shadow:0 4px 0 rgba(74,59,92,.2);font-size:22px;padding:0;pointer-events:none;}
.btn.on{transform:translateY(3px);box-shadow:0 1px 0 rgba(74,59,92,.2);background:#fff;}
.pad .up{grid-column:2;grid-row:1}.pad .left{grid-column:1;grid-row:2}.pad .right{grid-column:3;grid-row:2}.pad .down{grid-column:2;grid-row:3}
.pad::after{content:"";grid-column:2;grid-row:2;border-radius:50%;background:rgba(255,250,240,.45);margin:8px;}
.act{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;}
#dropBtn{width:104px;height:104px;border-radius:50%;border:0;padding:7px;touch-action:none;background:rgba(255,250,240,.85);box-shadow:0 5px 0 rgba(74,59,92,.2);}
#dropBtn span{display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#bfe6ff,#4fb0ff 60%,#2f86d6);color:#fff;font-size:21px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.1);text-shadow:0 2px 0 rgba(30,90,160,.5);}
#dropBtn.on{transform:translateY(3px);box-shadow:0 2px 0 rgba(74,59,92,.2);}
#needleBtn{border:0;border-radius:999px;padding:8px 16px;font-size:17px;background:#ff8fb1;color:#fff;box-shadow:0 4px 0 #e0577f;touch-action:none;}
#needleBtn em{font-style:normal;}
#needleBtn.ready{animation:wiggle .5s infinite;}
@keyframes wiggle{50%{transform:scale(1.12);}}

/* 알림 */
#banner{position:absolute;left:50%;top:22%;transform:translate(-50%,-20px) scale(.9);opacity:0;transition:all .25s cubic-bezier(.3,1.6,.6,1);
  background:var(--cream);border-radius:999px;padding:10px 26px;font-size:26px;box-shadow:0 6px 0 rgba(74,59,92,.18);pointer-events:none;white-space:nowrap;}
#banner.show{opacity:1;transform:translate(-50%,0) scale(1);}

/* 시작·메뉴·결과 화면 */
.screen{position:absolute;inset:0;display:grid;place-items:center;background:rgba(74,59,92,.25);
  padding-block:calc(10px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.panel{background:var(--cream);border-radius:28px;padding:16px 20px 18px;width:100%;max-width:780px;max-height:100%;overflow:auto;box-sizing:border-box;
  box-shadow:0 8px 0 rgba(74,59,92,.18);touch-action:pan-y;display:flex;flex-direction:column;gap:12px;text-align:center;}
.panel h1{margin:0;font-weight:400;font-size:34px;line-height:1.1;color:#2f9fe6;text-shadow:0 3px 0 #d6efff;text-wrap:balance;}
.panel h2{margin:0;font-weight:400;font-size:30px;text-wrap:balance;}
.sub{margin:0;font-size:15px;opacity:.75;}
#slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;}
@media (max-width:700px){#slots{grid-template-columns:repeat(3,minmax(0,1fr));}}
@media (max-width:420px){#slots{grid-template-columns:repeat(2,minmax(0,1fr));}}
#slots.single{grid-template-columns:minmax(0,200px);justify-content:center;}
.opts{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;}
.opts button{border:0;border-radius:999px;padding:6px 14px;font-size:15px;background:#fff;box-shadow:inset 0 0 0 2px var(--soft);}
.slot{background:#fff;border-radius:20px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:inset 0 0 0 3px var(--soft);min-width:0;}
.slot.off{opacity:.5;}
.slot .ava{border:0;background:var(--soft);border-radius:50%;width:68px;height:68px;padding:0;display:grid;place-items:center;}
.slot .ava canvas{width:66px;height:66px;}
.slot .ava:disabled{cursor:default;}
.slot input{width:100%;box-sizing:border-box;border:0;border-radius:12px;background:var(--soft);text-align:center;font:inherit;font-size:16px;padding:6px 4px;color:var(--ink);}
.slot .type{border:0;border-radius:999px;padding:5px 10px;font-size:14px;background:var(--mint);color:#1f5b47;width:100%;}
.slot .type.cpu{background:#ffe08a;color:#7a5600;}
.slot .type.none{background:var(--soft);color:var(--ink);}
.slot .type.remote{background:#cfe9ff;color:#1d5f99;}
.slot .teamb{border:0;border-radius:999px;padding:4px 10px;font-size:13px;color:#fff;width:100%;}
.how{margin:0;font-size:14px;line-height:1.5;opacity:.8;}
.big{border:0;border-radius:999px;padding:12px 30px;font-size:22px;background:var(--water);color:#fff;box-shadow:0 5px 0 #2f86d6;align-self:center;}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #2f86d6;}
.big.alt{background:var(--soft);color:var(--ink);box-shadow:0 5px 0 #d6c8ee;}
#startBtn:disabled{opacity:.65;}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
#setupMsg{margin:0;min-height:1em;color:#e0577f;font-size:14px;}
#winAva{width:130px;height:130px;align-self:center;}
.modes{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;}
.modes button{border:0;border-radius:999px;padding:8px 16px;font-size:16px;background:var(--soft);}
.modes button.on{background:var(--grape);color:#fff;box-shadow:0 3px 0 #7a6be0;}
#roomBox{background:#fff;border-radius:18px;padding:10px 14px;display:flex;flex-direction:column;gap:6px;align-items:center;box-shadow:inset 0 0 0 3px var(--soft);}
#roomBox .code{font-size:40px;letter-spacing:8px;color:#2f9fe6;line-height:1;}
#roomBox input{border:0;border-radius:12px;background:var(--soft);text-align:center;font:inherit;font-size:28px;letter-spacing:6px;padding:6px;width:160px;color:var(--ink);}
#roomBox p{margin:0;font-size:14px;}
@media (prefers-reduced-motion:reduce){#banner{transition:none;}#needleBtn.ready{animation:none;}}
#tapStart{position:absolute;inset:0;z-index:60;border:0;margin:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:rgba(74,59,92,.55);color:#fff;font-family:var(--font);font-size:30px;text-shadow:0 3px 0 rgba(74,59,92,.5);touch-action:manipulation;cursor:pointer;}
#tapStart b{font-weight:400;background:#ff8fb1;border-radius:999px;padding:14px 34px;box-shadow:0 6px 0 #e0577f;animation:tapPulse 1s infinite;}
#tapStart small{font-size:17px;opacity:.95;}
@keyframes tapPulse{50%{transform:scale(1.08);}}
</style>

<div id="app">
  <button id="tapStart" hidden><b>화면을 톡! 눌러서 시작</b><small>폰을 옆으로 눕히면 크게 보여요</small></button>
  <canvas id="cv" aria-label="놀이 화면"></canvas>
  <button class="icon-btn" id="menuBtn" aria-label="멈춤 메뉴">II</button>

  <div class="controls">
    <div class="pad" id="pad" aria-label="방향 패드">
      <button class="btn up" data-d="up" tabindex="-1">▲</button>
      <button class="btn left" data-d="left" tabindex="-1">◀</button>
      <button class="btn right" data-d="right" tabindex="-1">▶</button>
      <button class="btn down" data-d="down" tabindex="-1">▼</button>
    </div>
    <div class="act">
      <button id="needleBtn" hidden aria-label="바늘로 물방울 터뜨리기">바늘 <em id="needleNum">1</em></button>
      <button id="dropBtn" aria-label="물풍선 놓기"><span>물풍선</span></button>
    </div>
  </div>

  <div id="banner"></div>

  <div class="screen" id="setup">
    <div class="panel">
      <h1>몽글 물풍선</h1>
      <p class="sub">물풍선을 놓으면 십자로 물이 퍼져요. 맞으면 물방울에 갇히고, 같은 편이 닿으면 구출! 마지막까지 남으면 이겨요.</p>
      <div class="modes" id="modes">
        <button data-mode="local" class="on">이 폰 하나로</button>
        <button data-mode="host">방 만들기</button>
        <button data-mode="join">방 들어가기</button>
      </div>
      <div class="opts"><button id="mapBtn">지도</button><button id="teamBtn">개인전</button><button id="musicBtn">음악</button></div>
      <div id="roomBox" hidden></div>
      <div id="slots"></div>
      <p class="how">◀▲▼▶ 움직이기 · <b>물풍선</b> 버튼으로 놓기 · 상자를 터뜨리면 아이템이 나와요<br>물방울에 갇혔을 때 <b>같은 편</b>이 닿으면 구출, <b>다른 편</b>이 닿으면 톡 터져서 탈락 · <b>바늘</b>이 있으면 혼자 나와요</p>
      <p id="setupMsg"></p>
      <button class="big" id="startBtn">놀이 시작!</button>
    </div>
  </div>

  <div class="screen" id="menu" hidden>
    <div class="panel" style="max-width:340px">
      <h2>잠깐 쉬어요</h2>
      <button class="big" id="resumeBtn">계속하기</button>
      <button class="big alt" id="restartBtn">새 판으로 다시</button>
      <button class="big alt" id="homeBtn">처음 화면</button>
      <button class="big alt" id="soundBtn">소리 끄기</button>
      <button class="big alt" id="musicBtn2">음악 끄기</button>
    </div>
  </div>

  <div class="screen" id="result" hidden>
    <div class="panel" style="max-width:380px">
      <canvas id="winAva" width="260" height="260"></canvas>
      <h2 id="winText">토끼 승리!</h2>
      <p class="sub" id="winSub">모두 잘했어요</p>
      <div class="row">
        <button class="big" id="againBtn">한 판 더</button>
        <button class="big alt" id="home2Btn">처음 화면</button>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
// 친구 폰은 '시작'을 직접 누르지 않아서 가로 화면·화면 꺼짐 방지가 안 켜져요 → 한 번 톡 누르게 해요
let tapDone=false;
function goFull(){
  try{const el=document.documentElement;if(el.requestFullscreen&&!document.fullscreenElement)el.requestFullscreen().then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})).catch(()=>{});}catch(_){}
  try{if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(()=>{});}catch(_){}
}
function askTap(){if(!tapDone&&!document.fullscreenElement)$('#tapStart').hidden=false;}
document.addEventListener('DOMContentLoaded',()=>{});
setTimeout(()=>{const b=$('#tapStart');if(!b)return;b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();tapDone=true;b.hidden=true;try{audio();}catch(_){}goFull();});},0);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&tapDone)try{if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(()=>{});}catch(_){}}); // 다른 앱 갔다 오면 다시 화면 켜 두기
const TAU=Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
};
// 같이하기: local = 폰 한 대, host = 방장 폰(놀이 판정을 맡음), guest = 들어온 폰
const net={mode:'local',peer:null,conns:[],hostConn:null,myId:'host',code:null};
const isOnline=()=>net.mode!=='local';
const isHost=()=>net.mode!=='guest';
const canControl=p=>!!p&&p.ai==='human'&&p.owner===net.myId;

// ---------- 놀이 규칙 숫자 ----------
const COLS=13, ROWS=9, NT=COLS*ROWS;
const FUSE=150, FLAME=30, TRAP=5*60, GAME_T=150*60, READY_T=180; // 물풍선 2.5초, 물줄기 0.5초, 갇힘 5초, 한 판 2분 30초
const MAXNB=6, MAXR=7, MAXSPD=4;
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
const idx=(x,y)=>y*COLS+x;
const inb=(x,y)=>x>=0&&y>=0&&x<COLS&&y<ROWS;
const ANIMALS=[
  {id:'rabbit', name:'토끼',   body:'#ffb8cc', dark:'#ff7fa5'},
  {id:'bear',   name:'곰돌이', body:'#e9b47f', dark:'#c98a52'},
  {id:'chick',  name:'병아리', body:'#ffe066', dark:'#ffb81f'},
  {id:'cat',    name:'고양이', body:'#cbbcff', dark:'#9b8cff'},
  {id:'frog',   name:'개구리', body:'#91e69c', dark:'#4fc46a'},
  {id:'penguin',name:'펭귄',   body:'#86cbff', dark:'#3d9be6'},
];
// 아이템: 1 물풍선 하나 더, 2 물줄기 길게, 3 신발(빨라짐), 4 바늘(갇혔을 때 혼자 나옴)
const ITEMS=[null,
  {name:'물풍선 +1', color:'#4fb0ff'},
  {name:'물줄기 +1', color:'#9b8cff'},
  {name:'빨라졌다!', color:'#ff9f2e'},
  {name:'바늘 얻음', color:'#ff6f96'},
];
const TEAMS=[{name:'딸기팀',color:'#ff5c8a'},{name:'블루베리팀',color:'#4f7dff'}];
// 지도: 바닥·벽·상자 모양과 음악이 달라요
const THEMES=[
  {id:'meadow',name:'꽃밭 마을',song:'holland',bg:['#bdf0b0','#8fd88a'],floor:['#b7ea9f','#a6e08d'],edge:'#7cc46a',solid:'bush',box:'crate',boxCol:['#f6c98a','#c98f4f'],deco:'flower'},
  {id:'beach', name:'바닷가',   song:'canada', bg:['#8fe0ff','#ffe9b8'],floor:['#ffe9b8','#fbdc9c'],edge:'#e9b86a',solid:'rock',box:'gift', boxCol:['#7fe0c8','#3fb79a'],deco:'shell'},
  {id:'snow',  name:'눈 나라',  song:'arctic', bg:['#c9e4ff','#eef6ff'],floor:['#f4f9ff','#e2eefb'],edge:'#a9c8ee',solid:'ice', box:'gift', boxCol:['#ffb0c8','#ff7fa5'],deco:'snow'},
];
let theme=THEMES[0];
function pickTheme(id){return THEMES.find(t=>t.id===id)||THEMES[Math.floor(Math.random()*THEMES.length)];}

// ---------- 소리 (첫 터치 뒤에만 남) ----------
let actx=null, muted=store.get('mb_muted',false);
function audio(){
  if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}
  if(actx.state!=='running')Promise.resolve(actx.resume()).then(()=>{if(music.want&&!music.timer)playMusic(music.want);}).catch(()=>{});
  else if(music.want&&!music.timer)playMusic(music.want);
  return actx;
}
function tone(freq,dur,type,vol,slideTo){
  if(muted)return; const a=audio(); if(!a)return;
  const o=a.createOscillator(), g=a.createGain(), t=a.currentTime;
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,t);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(vol||.1,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur);
}
function noise(size,freq,vol){
  if(muted)return; const a=audio(); if(!a)return;
  const len=Math.floor(a.sampleRate*.45*size), buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
  const s=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain();
  s.buffer=buf; f.type='lowpass'; f.frequency.value=freq||800; g.gain.value=vol||.3;
  s.connect(f).connect(g).connect(a.destination); s.start();
}
const sfx={
  drop(){tone(260,.14,'sine',.14,520);},
  splash(){noise(.9,1600,.22);tone(900,.25,'sine',.06,260);},
  trap(){tone(380,.3,'sine',.1,900);setTimeout(()=>tone(600,.2,'sine',.07,1100),120);},
  rescue(){[659,784,988,1318].forEach((f,i)=>setTimeout(()=>tone(f,.14,'triangle',.1),i*70));},
  pop(){tone(1300,.09,'square',.05,300);noise(.3,3000,.15);},
  item(){[784,988,1318].forEach((f,i)=>setTimeout(()=>tone(f,.12,'triangle',.09),i*70));},
  beep(){tone(660,.12,'sine',.1);},
  go(){tone(990,.3,'triangle',.12);},
  win(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.28,'triangle',.12),i*150));},
  click(){tone(880,.05,'sine',.05);},
  join(){tone(660,.08,'square',.05,1320);},
};

// ---------- 배경 음악 (악보를 코드로 연주해요) ----------
// 악보: 8분음표 한 칸씩, "-"는 앞 음을 길게, "."는 쉼표, "|"는 마디 구분(읽기 편하라고)
const SONGS={
  lobby:  {bpm:132,inst:'marimba',  bass:'oompah',drum:'k h s h k h s h',prog:'C G Am F C G F C',
    mel:'G5 E5 G5 C6 - G5 E5 . | F5 A5 G5 F5 E5 - . . | G5 E5 G5 C6 - D6 C6 . | B5 G5 A5 B5 C6 - - . | E6 - D6 C6 A5 - G5 . | F5 G5 A5 F5 G5 - E5 . | D5 E5 F5 G5 A5 B5 C6 . | G5 - E5 D5 C5 - - .'},
  holland:{bpm:126,inst:'accordion',bass:'oompah',drum:'k . s . k . s .',prog:'F C F C Bb F C F',

const NOTE_IDX={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function midiOf(n){const m=/^([A-G])(#|b)?(\d)$/.exec(n);return m?12*(+m[3]+1)+NOTE_IDX[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0):0;}
const hz=m=>440*Math.pow(2,(m-69)/12);
function parseMel(str){
  const out=[];let last=null;
  for(const tok of str.replace(/\|/g,' ').trim().split(/\s+/)){
    if(tok==='-'){if(last)last.len++;out.push(null);}
    else if(tok==='.'){last=null;out.push(null);}
    else{last={m:midiOf(tok),len:1};out.push(last);}
  }

}
function chordNotes(name,oct){
  const m=/^([A-G])(#|b)?(m)?$/.exec(name), root=12*(oct+1)+NOTE_IDX[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0);

const music={want:null,cur:null,song:null,timer:null,step:0,nextT:0,on:store.get('mb_music',true),out:null};
function musicOut(){
  if(!music.out){music.out=actx.createGain();music.out.gain.value=music.on?.8:0;music.out.connect(actx.destination);}
  return music.out;
}
function playMusic(id){
  music.want=id;
  if(!actx||actx.state!=='running')return; // 첫 터치 뒤에 시작해요
  if(music.cur===id&&music.timer)return;
  stopMusic();
  const s=SONGS[id]; if(!s)return;
  if(!s._mel){s._mel=parseMel(s.mel);s._prog=s.prog.split(' ');s._drum=s.drum.split(' ');}
  music.cur=id;music.song=s;music.step=0;music.nextT=actx.currentTime+.1;
  music.timer=setInterval(musicTick,40);musicTick();
}
function stopMusic(){if(music.timer)clearInterval(music.timer);music.timer=null;music.cur=null;}

  const s=music.song; if(!actx||!s)return;
  const sd=60/s.bpm/2;

  while(music.nextT<actx.currentTime+.2){playStep(s,music.step,music.nextT,sd);music.nextT+=sd;music.step=(music.step+1)%s._mel.length;}
}
function playStep(s,i,t,sd){
  const out=musicOut(), pos=i%8, ch=chordNotes(s._prog[Math.floor(i/8)%s._prog.length],2);
  const n=s._mel[i]; if(n)inst(s.inst,hz(n.m),t,n.len*sd,out);
  if(s.bass==='oompah'){
    if(pos===0||pos===4)voice('triangle',hz(ch[0]+(pos===4?7:0)),t,sd*1.5,.09,out);
    if(pos===2||pos===6)ch.forEach(m=>voice('square',hz(m+24),t,sd*.6,.012,out,1200));
  }else if(s.bass==='drone'){if(pos===0)voice('sawtooth',hz(ch[0]),t,sd*8,.035,out,500,.2);}
  else if(s.bass==='pad'){if(pos===0)ch.forEach(m=>voice('sine',hz(m+12),t,sd*8,.03,out,0,.5));}
  else{if(pos===0||pos===4)voice('triangle',hz(ch[0]),t,sd*2,.09,out);if(pos===6)voice('triangle',hz(ch[2]),t,sd,.06,out);}
  if(pos===0&&s.bass!=='pad')ch.forEach(m=>voice('sine',hz(m+24),t,sd*7,.012,out,0,.3));
  const d=s._drum[pos]; if(d&&d!=='.')drum(d,t,out);
}
function voice(type,f,t,dur,vol,out,lp,att){
  const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;
  let node=o; if(lp){const fl=actx.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;o.connect(fl);node=fl;}
  const at=att||.01;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+at);g.gain.setValueAtTime(vol,t+Math.max(at,dur*.6));g.gain.exponentialRampToValueAtTime(.0001,t+dur+.08);
  node.connect(g).connect(out);o.start(t);o.stop(t+dur+.12);
}
function pluckV(type,f,t,dec,vol,out){
  const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dec);o.connect(g).connect(out);o.start(t);o.stop(t+dec+.05);
}
function inst(kind,f,t,dur,out){
  switch(kind){
    case 'marimba':pluckV('sine',f,t,.35,.11,out);pluckV('sine',f*4,t,.08,.02,out);break;
    case 'pluck':pluckV('triangle',f,t,.5,.12,out);pluckV('sine',f*2,t,.2,.03,out);break;      // 기타 느낌
    case 'accordion':voice('square',f,t,dur,.03,out,1800,.02);voice('square',f*1.004,t,dur,.03,out,1800,.02);break;
    case 'bell':pluckV('sine',f,t,1.4,.08,out);pluckV('sine',f*2.76,t,.5,.025,out);break;      // 종소리

let noiseBuf=null;
function drum(k,t,out){
  if(k==='k'||k==='D'||k==='T'){
    const o=actx.createOscillator(),g=actx.createGain(),f0=k==='k'?150:k==='D'?120:220,f1=k==='k'?50:k==='D'?70:140;
    o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+.12);
    g.gain.setValueAtTime(k==='T'?.08:.15,t);g.gain.exponentialRampToValueAtTime(.0001,t+.18);

  if(!noiseBuf){noiseBuf=actx.createBuffer(1,actx.sampleRate*.3,actx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const src=actx.createBufferSource(),f=actx.createBiquadFilter(),g=actx.createGain();
  src.buffer=noiseBuf;f.type=k==='s'?'bandpass':'highpass';f.frequency.value=k==='s'?1800:k==='h'?7000:3000;
  const v=k==='s'?.07:k==='h'?.022:.06, d=k==='s'?.12:.05;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  src.connect(f).connect(g).connect(out);src.start(t);src.stop(t+d+.02);
}

// ---------- 색·입체 그리기 도구 ----------
function shade(hex,amt){ // amt>0 밝게, amt<0 어둡게
  const n=parseInt(hex.slice(1),16); let r=n>>16,g=n>>8&255,b=n&255;
  if(amt>0){r+=(255-r)*amt;g+=(255-g)*amt;b+=(255-b)*amt;}else{r*=1+amt;g*=1+amt;b*=1+amt;}
  return 'rgb('+(r|0)+','+(g|0)+','+(b|0)+')';
}
function ell(c,x,y,rx,ry,rot,fill){c.beginPath();c.ellipse(x,y,rx,ry,rot||0,0,TAU);c.fillStyle=fill;c.fill();}
function ball(c,x,y,rx,ry,col,rot){ // 빛이 왼쪽 위에서 비치는 동그란 공
  const m=Math.max(rx,ry), g=c.createRadialGradient(x-rx*.35,y-ry*.45,m*.08,x,y,m*1.05);

}
function gloss(c,x,y,rx,ry,a){c.save();c.globalAlpha=a||.55;ell(c,x,y,rx,ry,-.6,'#fff');c.restore();}
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function star(c,x,y,r,fill){

function heart(c,x,y,s,fill){

// ---------- 동물 친구 그리기 (1번 게임 몽글 대포놀이에서 가져옴) ----------
function drawChar(c,x,fy,r,ai,o){
  // x, fy = 발 위치. o: {dir, mood, t, phase, hurt}
  const A=ANIMALS[ai], dir=o.dir||1, t=o.t||0, ph=o.phase||0, mood=o.mood||'idle';

  else if(mood==='happy'){bob=Math.abs(Math.sin(t*.2))*r*.45;tilt=Math.sin(t*.2)*.16;}

  else if(mood==='surprised'){sy=1.08;sx=.95;bob=r*.12;tilt=0;}

function drawBody(c,r,A,dir,mood,t,ph){

function drawFace(c,r,A,dir,mood,t,ph){

  c.lineCap='round';c.lineJoin='round';
  const blink=(mood==='idle'||mood==='excited')&&(Math.floor((t+ph*50)/6)%45===0);
  for(const s of[-1,1]){
    const x=(frog?dir*r*.06:fx)+s*ex;
    c.strokeStyle=ink;c.lineWidth=r*.09;

      c.beginPath();c.moveTo(x-r*.12,ey-r*.12);c.lineTo(x+r*.12,ey+r*.12);c.moveTo(x+r*.12,ey-r*.12);c.lineTo(x-r*.12,ey+r*.12);c.stroke();

    c.beginPath();c.moveTo(fx-r*.14,my-r*.04);c.lineTo(fx+r*.14,my-r*.04);c.lineTo(fx+dir*r*.04,my+(open?r*.1:r*.18));c.closePath();c.fill();

  }else if(mood==='sad'){
    c.arc(fx,my+r*.2,r*.12,Math.PI*1.2,Math.PI*1.8);c.stroke();
  }else if(mood==='surprised'){
    ell(c,fx,my+r*.1,r*.08,r*.11,0,'#8a3a4a');
  }else if(mood==='focus'){
    c.moveTo(fx-r*.1,my+r*.1);c.quadraticCurveTo(fx-r*.05,my+r*.04,fx,my+r*.1);c.quadraticCurveTo(fx+r*.05,my+r*.16,fx+r*.1,my+r*.1);c.stroke();
  }else if(mood==='faint'){
    c.moveTo(fx-r*.12,my+r*.12);c.quadraticCurveTo(fx,my,fx+r*.12,my+r*.12);c.stroke();
  }else{
    c.arc(fx-r*.08,my,r*.08,.1,Math.PI-.1);c.moveTo(fx+r*.16,my+r*.02);c.arc(fx+r*.08,my,r*.08,.1,Math.PI-.1);c.stroke();
  }
}
function drawGroup(canvas,list){

}
function drawAvatar(canvas,ai,mood){

// ---------- 물풍선·물줄기·아이템 그림 ----------
function drawBalloonShape(c,x,y,r,col,t,urgent){ // x,y = 풍선 가운데
  ell(c,x,y+r*.95,r*.85,r*.25,0,'rgba(40,80,140,.18)');
  ball(c,x,y,r,r*1.05,col);
  if(urgent>0){c.save();c.globalAlpha=urgent;ell(c,x,y,r,r*1.05,0,'#fff');c.restore();}
  // 묶은 꼭지
  c.fillStyle=shade(col,-.15);c.beginPath();c.moveTo(x-r*.18,y-r*1.12);c.lineTo(x+r*.18,y-r*1.12);c.lineTo(x,y-r*.95);c.closePath();c.fill();
  ell(c,x,y-r*1.16,r*.14,r*.1,0,shade(col,-.2));
  gloss(c,x-r*.38,y-r*.42,r*.26,r*.15,.7);
  // 웃는 얼굴
  const ink='rgba(40,30,60,.75)';
  ell(c,x-r*.3,y+r*.05,r*.09,r*.12,0,ink);ell(c,x+r*.3,y+r*.05,r*.09,r*.12,0,ink);
  c.strokeStyle=ink;c.lineWidth=r*.09;c.lineCap='round';c.beginPath();c.arc(x,y+r*.22,r*.16,.3,Math.PI-.3);c.stroke();
}
function drawItemIcon(c,x,y,s,k){
  ball(c,x,y,s,s,ITEMS[k].color);

  if(k===1){ // 물풍선
    ell(c,x,y+s*.05,s*.42,s*.48,0,'#fff');c.beginPath();c.moveTo(x-s*.12,y-s*.5);c.lineTo(x+s*.12,y-s*.5);c.lineTo(x,y-s*.36);c.closePath();c.fill();
    ell(c,x-s*.14,y-s*.1,s*.1,s*.07,-.6,ITEMS[1].color);
  }else if(k===2){ // 물줄기
    drop(c,x,y+s*.08,s*.62,'#fff');ell(c,x-s*.12,y+s*.12,s*.08,s*.12,0,ITEMS[2].color);
  }else if(k===3){ // 신발
    c.beginPath();c.moveTo(x-s*.5,y+s*.3);c.lineTo(x-s*.45,y-s*.35);c.quadraticCurveTo(x-s*.15,y-s*.38,x-s*.08,y-s*.1);
    c.quadraticCurveTo(x+s*.5,y-s*.02,x+s*.55,y+s*.3);c.closePath();c.fill();
    c.strokeStyle=ITEMS[3].color;c.lineWidth=s*.08;c.beginPath();c.moveTo(x-s*.5,y+s*.18);c.lineTo(x+s*.54,y+s*.18);c.stroke();
  }else if(k===4){ // 바늘
    c.lineWidth=s*.16;c.beginPath();c.moveTo(x-s*.45,y+s*.45);c.lineTo(x+s*.4,y-s*.4);c.stroke();
    c.lineWidth=s*.08;c.beginPath();c.arc(x+s*.38,y-s*.38,s*.14,0,TAU);c.stroke();

}

// ---------- 놀이 상태 ----------
let game=null, players=[];
let grid=new Uint8Array(NT), itemG=new Uint8Array(NT), hidG=new Uint8Array(NT); // grid: 0 빈칸 1 벽 2 상자
const SPAWNS=[[0,0],[12,8],[12,0],[0,8],[6,4]];
function setTheme(id){const t=pickTheme(id);if(t!==theme){theme=t;}bgDirty=true;}
function makeMap(spawnList){
  grid=new Uint8Array(NT);itemG=new Uint8Array(NT);hidG=new Uint8Array(NT);
  const safe=new Set();
  for(const [sx,sy] of spawnList)for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(Math.abs(x-sx)+Math.abs(y-sy)<=3)safe.add(idx(x,y));
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const i=idx(x,y);
    if(x%2===1&&y%2===1)grid[i]=1;
    else if(!safe.has(i)&&Math.random()<.7){
      grid[i]=2;
      if(Math.random()<.45){const r=Math.random();hidG[i]=r<.36?1:r<.72?2:r<.9?3:4;}
    }
  }
}
function newGame(list,demo,themeId){
  setTheme(themeId);
  const teamMode=!demo&&setupOpt.team;
  const order=list.map((s,i)=>({...s,team:teamMode?(s.team|0):i}));
  const n=order.length, spots=SPAWNS.slice(0,n);
  let at;
  if(teamMode){ // 같은 팀은 같은 쪽에서 시작해요
    const left=[0,3,4],right=[2,1,4],used=new Set();at=[];
    order.forEach((s,i)=>{const side=s.team===0?left:right;const k=side.find(v=>!used.has(v));used.add(k);at[i]=SPAWNS[k];});
    spots.length=0;at.forEach(a=>spots.push(a));
  }else{
    at=spots.slice();for(let i=at.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[at[i],at[j]]=[at[j],at[i]];}
  }
  makeMap(at);
  players=order.map((s,i)=>({
    name:s.name||ANIMALS[s.animal].name, animal:s.animal, ai:s.type==='remote'||s.type==='human'?'human':s.type, owner:s.owner||'host', team:s.team,
    x:at[i][0], y:at[i][1], rx:at[i][0], ry:at[i][1], dir:at[i][0]<COLS/2?1:-1, moving:false,
    nb:1, rng:2, spd:0, ndl:0, trap:0, out:false, inv:0, phase:rand(0,TAU), mood:'idle', moodT:0, path:null, thinkT:0, escT:0, pv:1,
  }));
  game={demo:!!demo,state:'ready',cd:demo?30:READY_T,time:GAME_T,tick:0,balloons:[],flames:[],bid:0,parts:[],texts:[],shake:0,
    teamMode,winTeam:-1,endT:0,paused:false,evq:[],playT:0,hurry:false};
  layout();
}
function speedOf(p){return p.trap?.018:.052+p.spd*.012;}
function balloonAt(x,y){for(const b of game.balloons)if(b.x===x&&b.y===y)return b;return null;}
function free(x,y){return inb(x,y)&&grid[idx(x,y)]===0&&!balloonAt(x,y);}
function setMood(p,m,t){p.mood=m;p.moodT=t;}

// 움직이기: 칸 줄에 맞춰 가고, 모서리에 살짝 걸리면 옆으로 미끄러져 들어가요
function move(p,dx,dy,spMax){
  if(!dx&&!dy){p.moving=false;return;}
  p.moving=true; if(dx)p.dir=dx;
  let sp=spMax==null?speedOf(p):Math.min(speedOf(p),spMax);
  const hor=!!dx, d=hor?dx:dy;
  let a=hor?p.x:p.y, b=hor?p.y:p.x;
  const fr=(A,B)=>hor?free(A,B):free(B,A);
  const ra=Math.round(a), rb=Math.round(b), ahead=ra+d;
  let tb=rb;
  if(!fr(ahead,rb)&&Math.abs(b-rb)>.12){const alt=rb+Math.sign(b-rb);if(fr(ahead,alt))tb=alt;}
  if(Math.abs(b-tb)>.001){const st=Math.min(sp,Math.abs(tb-b));b+=Math.sign(tb-b)*st;if(tb!==rb)sp=0;else sp=Math.max(0,sp-st*.5);}
  const rb2=Math.round(b), open=fr(ahead,rb2);
  if(sp>0){
    if(open)a+=d*sp;
    else if(d*(a-ra)<0)a=d>0?Math.min(a+sp,ra):Math.max(a-sp,ra);
  }
  if(hor){p.x=clamp(a,0,COLS-1);p.y=b;}else{p.y=clamp(a,0,ROWS-1);p.x=b;}
}

// 일이 생기면(물풍선 놓기, 터짐, 갇힘…) 소리·효과를 내고, 방장이면 친구 폰에도 알려 줘요
function emit(e){handleEvent(e);if(net.mode==='host'&&!game.demo)game.evq.push(e);}
function handleEvent(e){
  if(!game)return;
  const quiet=game.demo;
  const p=e.p!=null?players[e.p]:null;
  switch(e.k){
    case 'drop':if(!quiet)sfx.drop();break;
    case 'boom':
      if(!quiet)sfx.splash();game.shake=Math.max(game.shake,3);
      for(let i=0;i<10;i++){const a=rand(0,TAU),v=rand(.02,.07);game.parts.push({k:'drop',x:e.x+.5,y:e.y+.5,vx:Math.cos(a)*v,vy:Math.sin(a)*v-.03,z:0,life:0,max:rand(24,40),r:rand(.05,.1)});}
      break;
    case 'break':
      for(let i=0;i<7;i++)game.parts.push({k:'chip',x:e.x+.5,y:e.y+.4,vx:rand(-.05,.05),vy:rand(-.09,-.03),life:0,max:rand(26,40),r:rand(.06,.11),rot:rand(0,TAU),col:theme.boxCol[i%2]});
      break;
    case 'trap':if(p){if(!quiet)sfx.trap();setMood(p,'surprised',50);}break;
    case 'rescue':if(p){if(!quiet)sfx.rescue();setMood(p,'happy',70);addText('구출!',p.x+.5,p.y-.2,'#ff6f96');
      for(let i=0;i<5;i++)game.parts.push({k:'heart',x:p.x+.5+rand(-.3,.3),y:p.y,vx:rand(-.01,.01),vy:-.03,life:0,max:50,r:.15});}break;
    case 'needle':if(p){if(!quiet)sfx.pop();setMood(p,'happy',60);addText('바늘로 톡!',p.x+.5,p.y-.2,'#ff6f96');}break;
    case 'out':if(p){if(!quiet)sfx.pop();addText(p.name+' 탈락',p.x+.5,p.y-.2,'#7a6be0');
      for(let i=0;i<10;i++){const a=rand(0,TAU);game.parts.push({k:'drop',x:p.x+.5,y:p.y+.2,vx:Math.cos(a)*.06,vy:Math.sin(a)*.06,life:0,max:30,r:.08});}
      game.parts.push({k:'ghost',x:p.x+.5,y:p.y+.4,vx:0,vy:-.02,life:0,max:80,a:p.animal});}break;
    case 'item':if(p){if(!quiet&&canControl(p))sfx.item();addText(ITEMS[e.i].name,p.x+.5,p.y-.2,ITEMS[e.i].color);}break;
  }
}
function addText(t,x,y,color){game.texts.push({t,x,y,color,life:0,max:70});}

function tryDrop(p){
  if(!game||game.state!=='play'||!p||p.out||p.trap)return;
  const x=Math.round(p.x),y=Math.round(p.y),me=players.indexOf(p);
  if(grid[idx(x,y)]!==0||balloonAt(x,y))return;
  if(game.balloons.filter(b=>b.o===me).length>=p.nb)return;
  game.balloons.push({id:++game.bid,x,y,t:FUSE,r:p.rng,o:me});
  emit({k:'drop',x,y});
}
function useNeedle(p){
  if(!p||!p.trap||p.ndl<=0||p.out)return;
  p.ndl--;p.trap=0;p.inv=60;emit({k:'needle',p:players.indexOf(p)});
}
function explode(b){
  const k=game.balloons.indexOf(b); if(k<0)return;
  game.balloons.splice(k,1);
  emit({k:'boom',x:b.x,y:b.y});
  const chain=[];
  game.flames.push({x:b.x,y:b.y,dx:0,dy:0,tip:false,life:FLAME});
  for(const [dx,dy] of DIRS){
    for(let s=1;s<=b.r;s++){
      const x=b.x+dx*s,y=b.y+dy*s;
      if(!inb(x,y)||grid[idx(x,y)]===1)break;
      const box=grid[idx(x,y)]===2, ob=balloonAt(x,y), nx=x+dx, ny=y+dy;
      const tip=s===b.r||box||!!ob||!inb(nx,ny)||grid[idx(nx,ny)]===1;
      game.flames.push({x,y,dx,dy,tip,life:FLAME});
      if(box){breakBox(x,y);break;}
      if(ob){chain.push(ob);break;}
    }
  }
  chain.forEach(explode); // 물줄기가 닿은 다른 물풍선도 같이 터져요
}
function breakBox(x,y){
  const i=idx(x,y);grid[i]=0;
  if(hidG[i]){itemG[i]=hidG[i];hidG[i]=0;}
  emit({k:'break',x,y});
}
function knockOut(p){p.out=true;p.trap=0;p.moving=false;emit({k:'out',p:players.indexOf(p)});}
function endGame(team){
  if(game.state==='ending'||game.state==='over')return;
  game.state='ending';game.endT=110;game.winTeam=team;
  players.forEach(p=>{if(!p.out&&p.team===team)setMood(p,'happy',9999);});
}

// 방장(또는 폰 한 대) 판정: 물풍선·물줄기·갇힘·구출·아이템·시간
function hostStep(){
  for(const b of game.balloons.slice()){b.t--;if(b.t<=0)explode(b);}
  game.flames=game.flames.filter(f=>--f.life>0);
  const wet=new Set(game.flames.map(f=>idx(f.x,f.y)));
  players.forEach((p,pi)=>{
    if(p.out)return;
    const i=idx(Math.round(p.x),Math.round(p.y));
    if(!p.trap&&p.inv<=0&&wet.has(i)){p.trap=TRAP;p.path=null;emit({k:'trap',p:pi});}
    if(p.trap){p.trap--;if(p.trap<=0){knockOut(p);return;}}
    if(!p.trap&&itemG[i]){
      const k=itemG[i];itemG[i]=0;
      if(k===1)p.nb=Math.min(MAXNB,p.nb+1);else if(k===2)p.rng=Math.min(MAXR,p.rng+1);else if(k===3)p.spd=Math.min(MAXSPD,p.spd+1);else p.ndl=Math.min(3,p.ndl+1);
      emit({k:'item',p:pi,i:k});
    }
  });
  // 갇힌 친구에게 닿으면: 같은 편은 구출, 다른 편은 톡 (탈락)
  for(const p of players){
    if(p.out||!p.trap)continue;
    for(const q of players){
      if(q===p||q.out||q.trap||Math.abs(q.x-p.x)>.6||Math.abs(q.y-p.y)>.6)continue;
      if(q.team===p.team){p.trap=0;p.inv=90;emit({k:'rescue',p:players.indexOf(p)});}
      else{knockOut(p);setMood(q,'happy',60);}
      break;
    }
  }
  if(game.state==='play'){
    game.time--;
    const alive=players.filter(p=>!p.out), teams=new Set(alive.map(p=>p.team));
    if(teams.size<=1&&players.length>1)endGame(teams.size?[...teams][0]:-1);
    else if(game.time<=0){ // 시간 끝: 남은 친구가 더 많은 쪽이 이겨요
      const cnt={};alive.forEach(p=>cnt[p.team]=(cnt[p.team]||0)+(p.trap?.5:1));
      const best=Math.max(...Object.values(cnt)), top=Object.keys(cnt).filter(k=>cnt[k]===best);
      addText('시간 끝!',COLS/2,ROWS/2-1,'#4a3b5c');
      endGame(top.length===1?+top[0]:-1);
    }
  }
}
// 친구 폰: 방장이 보내 준 상태 사이를 부드럽게 이어요
function guestStep(){
  for(const b of game.balloons)if(b.t>1)b.t--;
  game.flames=game.flames.filter(f=>--f.life>0);
  if(game.state==='play'&&game.time>0)game.time--;
}

// ---------- 컴퓨터 친구 ----------
let dmCache={tick:-1,map:null};
function blastEach(b,cb){
  cb(b.x,b.y);
  for(const [dx,dy] of DIRS)for(let s=1;s<=b.r;s++){
    const x=b.x+dx*s,y=b.y+dy*s;
    if(!inb(x,y)||grid[idx(x,y)]===1)break;
    cb(x,y);
    if(grid[idx(x,y)]===2||game.balloons.some(o=>o!==b&&o.x===x&&o.y===y))break;
  }
}
function dangerMap(extra){ // 칸마다 물이 몇 프레임 뒤에 오는지 (Infinity = 안전)
  const d=new Float32Array(NT).fill(Infinity);
  const bl=game.balloons.map(b=>({x:b.x,y:b.y,r:b.r,t:b.t}));
  if(extra)bl.push(extra);
  for(let pass=0;pass<3;pass++)for(const b of bl)blastEach(b,(x,y)=>{for(const o of bl)if(o!==b&&o.x===x&&o.y===y&&o.t>b.t)o.t=b.t;});
  for(const b of bl)blastEach(b,(x,y)=>{const i=idx(x,y);if(b.t<d[i])d[i]=b.t;});
  for(const f of game.flames){const i=idx(f.x,f.y);d[i]=Math.min(d[i],f.life-FLAME);}
  return d;
}
function danger(){if(dmCache.tick!==game.tick){dmCache={tick:game.tick,map:dangerMap()};}return dmCache.map;}
function wetAt(dm,i,arrive){return dm[i]-arrive<26&&dm[i]+FLAME+8>arrive;}
function bfs(p,dm){ // 갈 수 있는 칸과 거리
  const sx=Math.round(p.x),sy=Math.round(p.y),s=idx(sx,sy),fpt=1/speedOf(p);
  const dist=new Int16Array(NT).fill(-1),prev=new Int16Array(NT).fill(-1),q=[s];dist[s]=0;
  for(let h=0;h<q.length;h++){
    const c=q[h],cx=c%COLS,cy=(c/COLS)|0;
    for(const [dx,dy] of DIRS){
      const nx=cx+dx,ny=cy+dy; if(!free(nx,ny))continue;
      const n=idx(nx,ny); if(dist[n]>=0)continue;
      if(wetAt(dm,n,(dist[c]+1)*fpt))continue;
      dist[n]=dist[c]+1;prev[n]=c;q.push(n);
    }
  }
  return{dist,prev,s,order:q};
}
function pathTo(r,goal){const out=[];let c=goal;while(c!==r.s&&c>=0){out.unshift([c%COLS,(c/COLS)|0]);c=r.prev[c];}return out;}
function aiThink(p){
  const easy=p.ai==='easy', me=players.indexOf(p), dm=danger();
  const cx=Math.round(p.x),cy=Math.round(p.y),here=idx(cx,cy);
  // 1) 물이 올 자리면 피하기
  if(dm[here]!==Infinity){
    const r=bfs(p,dm);let best=-1;
    for(const c of r.order)if(dm[c]===Infinity){best=c;break;}
    p.path=best>=0?pathTo(r,best):null;return;
  }
  if(p.trap)return;
  // 2) 상자나 다른 편이 물줄기에 닿으면 물풍선 놓기 (도망갈 곳이 있을 때만)
  const mine=game.balloons.filter(b=>b.o===me).length;
  if(mine<p.nb&&!balloonAt(cx,cy)&&game.state==='play'){
    let worth=0;
    blastEach({x:cx,y:cy,r:p.rng},(x,y)=>{
      if(grid[idx(x,y)]===2)worth+=1;
      for(const q of players)if(q!==p&&!q.out&&!q.trap&&q.team!==p.team&&Math.round(q.x)===x&&Math.round(q.y)===y)worth+=easy?1:3;
    });
    if(worth>0&&(!easy||Math.random()<.45)){
      const dm2=dangerMap({x:cx,y:cy,r:p.rng,t:FUSE});
      game.balloons.push({id:-1,x:cx,y:cy,t:FUSE,r:p.rng,o:me}); // 놓았다고 치고 길 찾기
      const r=bfs(p,dm2);game.balloons.pop();
      let best=-1;for(const c of r.order)if(dm2[c]===Infinity&&r.dist[c]<=(easy?4:6)){best=c;break;}
      if(best>=0){tryDrop(p);dmCache.tick=-1;p.path=pathTo(r,best);return;}
    }
  }
  // 3) 갈 곳 고르기: 갇힌 친구 > 아이템 > 상자 옆 > 다른 편 근처
  const r=bfs(p,dm);let best=-1,bs=0;
  const trapped=players.filter(q=>!q.out&&q.trap&&q!==p);
  for(const c of r.order){
    if(dm[c]!==Infinity)continue;
    const x=c%COLS,y=(c/COLS)|0,d=r.dist[c];let s=0;
    for(const q of trapped)if(Math.round(q.x)===x&&Math.round(q.y)===y)s=Math.max(s,(q.team===p.team?220:easy?90:200)-d*3);
    if(itemG[c])s=Math.max(s,(easy?60:100)-d*6);
    if(s<40&&mine<p.nb){
      let w=0;blastEach({x,y,r:p.rng},(bx,by)=>{if(grid[idx(bx,by)]===2)w++;});
      if(w)s=Math.max(s,30+w*4-d*4);
      if(!easy)for(const q of players)if(q!==p&&!q.out&&!q.trap&&q.team!==p.team&&Math.abs(Math.round(q.x)-x)+Math.abs(Math.round(q.y)-y)<=1)s=Math.max(s,55-d*3);
    }
    if(s>bs){bs=s;best=c;}
  }
  if(best>=0&&best!==here){p.path=pathTo(r,best);return;}
  if(best===here){p.path=[];return;}
  // 갈 곳이 없으면 다른 편 쪽으로 어슬렁
  const foe=players.find(q=>!q.out&&q.team!==p.team);
  if(foe&&r.order.length>1){
    let bc=-1,bd=1e9;for(const c of r.order){if(dm[c]!==Infinity)continue;const dd=Math.abs(c%COLS-foe.x)+Math.abs(((c/COLS)|0)-foe.y);if(dd<bd){bd=dd;bc=c;}}
    p.path=bc>=0&&bc!==here?pathTo(r,bc):[];
  }else p.path=[];
}
function aiUpdate(p){
  const easy=p.ai==='easy';
  p.thinkT--;p.escT--;
  const dm=danger(), here=idx(Math.round(p.x),Math.round(p.y));
  if(p.escT<=0&&dm[here]!==Infinity&&(!p.path||!p.path.length||dm[idx(...p.path[p.path.length-1])]!==Infinity)){p.escT=easy?14:5;p.thinkT=0;}
  if(p.thinkT<=0||!p.path){aiThink(p);p.thinkT=easy?26:9;}
  if(p.path&&p.path.length){
    const [nx,ny]=p.path[0], dx=nx-p.x, dy=ny-p.y;
    if(Math.abs(dx)<.04&&Math.abs(dy)<.04){p.x=nx;p.y=ny;p.path.shift();if(!p.path.length)p.moving=false;return;}
    if(Math.abs(dx)>Math.abs(dy))move(p,Math.sign(dx),0,Math.abs(dx));else move(p,0,Math.sign(dy),Math.abs(dy));
  }else{ // 칸 가운데로
    const dx=Math.round(p.x)-p.x,dy=Math.round(p.y)-p.y;
    if(Math.abs(dx)>.02)move(p,Math.sign(dx),0,Math.abs(dx));else if(Math.abs(dy)>.02)move(p,0,Math.sign(dy),Math.abs(dy));else p.moving=false;
  }
}

// ---------- 한 프레임 ----------
function update(){
  if(!game||game.paused&&!isOnline())return;
  game.tick++;
  const host=isHost();
  if(game.state==='ready'){
    if(host||game.demo)game.cd--;
    if(!game.demo&&game.cd>0&&game.cd%60===0)sfx.beep();
    if(game.cd<=0&&(host||game.demo)){game.state='play';game.playT=0;if(!game.demo)sfx.go();}
  }
  if(game.state==='play'||game.state==='ending'){
    game.playT++;
    for(const p of players){
      if(p.out)continue;
      if(canControl(p)){const d=inputDir();move(p,d[0],d[1]);}
      else if(host&&p.ai!=='human')aiUpdate(p);
      if(p.inv>0)p.inv--;
    }
    if(host)hostStep();else guestStep();
    if(game.state==='play'&&!game.hurry&&game.time<=30*60){game.hurry=true;if(!game.demo)addText('30초 남았어요!',COLS/2,1.5,'#ff6f96');}
  }
  if(game.state==='ending'&&host){
    game.endT--;
    if(game.endT<=0)finish();
  }
  for(const p of players){
    if(p.moodT>0&&p.moodT<9999)p.moodT--;
    if(canControl(p)||(host&&p.ai!=='human')){p.rx=p.x;p.ry=p.y;}
    else{
      if(Math.abs(p.x-p.rx)+Math.abs(p.y-p.ry)>2){p.rx=p.x;p.ry=p.y;}
      p.rx+=(p.x-p.rx)*.35;p.ry+=(p.y-p.ry)*.35;
    }
  }
  if(game.shake>0)game.shake*=.85;if(game.shake<.2)game.shake=0;
  game.parts=game.parts.filter(q=>{
    q.life++;q.x+=q.vx;q.y+=q.vy;
    if(q.k==='drop'||q.k==='chip')q.vy+=.004;
    return q.life<q.max;
  });
  game.texts=game.texts.filter(x=>{x.life++;x.y-=.012;return x.life<x.max;});
  if(game.demo&&game.state==='over'&&game.tick%90===0)demo();
  // 같이하기: 방장은 상태를 1초에 20번, 친구는 내 위치를 1초에 20번 보내요
  if(game.tick%3===0&&!game.demo){if(net.mode==='host')sendSnap();else if(net.mode==='guest')sendMe();}
  if(game.tick%60===0&&!game.demo)checkAlive();
  syncHud();
}
function finish(){
  game.state='over';
  if(game.demo)return;
  if(net.mode==='host'){sendSnap();send({t:'over',w:game.winTeam});}
  showResult();
}

const padDir={x:0,y:0};
const pad=$('#pad');
let padPointer=null;
function padFrom(e){
  const r=pad.getBoundingClientRect(), dx=e.clientX-(r.left+r.width/2), dy=e.clientY-(r.top+r.height/2);
  if(Math.hypot(dx,dy)<r.width*.1){padDir.x=padDir.y=0;}
  else if(Math.abs(dx)>Math.abs(dy)){padDir.x=Math.sign(dx);padDir.y=0;}else{padDir.x=0;padDir.y=Math.sign(dy);}
  const on=padDir.x>0?'right':padDir.x<0?'left':padDir.y>0?'down':padDir.y<0?'up':'';
  pad.querySelectorAll('.btn').forEach(b=>b.classList.toggle('on',b.dataset.d===on));
}
function padOff(){padPointer=null;padDir.x=padDir.y=0;pad.querySelectorAll('.btn').forEach(b=>b.classList.remove('on'));}
pad.addEventListener('pointerdown',e=>{e.preventDefault();audio();padPointer=e.pointerId;try{pad.setPointerCapture(e.pointerId);}catch(_){}padFrom(e);});
pad.addEventListener('pointermove',e=>{if(e.pointerId===padPointer)padFrom(e);});
pad.addEventListener('pointerup',e=>{if(e.pointerId===padPointer)padOff();});
pad.addEventListener('pointercancel',padOff);pad.addEventListener('lostpointercapture',padOff);
const keyMap={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1],a:[-1,0],d:[1,0],w:[0,-1],s:[0,1],A:[-1,0],D:[1,0],W:[0,-1],S:[0,1]};
let keyStack=[];
function inputDir(){
  if(padDir.x||padDir.y)return[padDir.x,padDir.y];
  const k=keyStack[keyStack.length-1];return k?keyMap[k]:[0,0];
}
function myPlayer(){return players.find(canControl);}
function doDrop(){
  const p=myPlayer(); if(!p||!game||game.state!=='play')return;
  if(p.trap){doNeedle();return;}
  if(net.mode==='guest'){sendMe();send({t:'drop',i:players.indexOf(p)});}
  else tryDrop(p);
}
function doNeedle(){
  const p=myPlayer(); if(!p||!p.trap||p.ndl<=0)return;
  if(net.mode==='guest')send({t:'needle',i:players.indexOf(p)});else useNeedle(p);
}
const db=$('#dropBtn');
db.addEventListener('pointerdown',e=>{e.preventDefault();audio();db.classList.add('on');doDrop();});
db.addEventListener('pointerup',()=>db.classList.remove('on'));db.addEventListener('pointercancel',()=>db.classList.remove('on'));
$('#needleBtn').addEventListener('pointerdown',e=>{e.preventDefault();doNeedle();});
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(keyMap[e.key]){if(!keyStack.includes(e.key))keyStack.push(e.key);e.preventDefault();}
  if((e.code==='Space'||e.key==='Enter')&&!e.repeat&&game&&!game.demo){e.preventDefault();doDrop();}
  if((e.key==='n'||e.key==='N')&&!e.repeat)doNeedle();
});
addEventListener('keyup',e=>{keyStack=keyStack.filter(k=>k!==e.key&&k.toLowerCase()!==e.key.toLowerCase());});
addEventListener('blur',()=>{keyStack=[];padOff();});

const cv=$('#cv'), ctx=cv.getContext('2d');
const FONT='"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const view={T:40,bx:0,by:0,cw:innerWidth,ch:innerHeight,dpr:1,land:true,side:160};
let bgDirty=true;
const bgc=document.createElement('canvas');
const spr={solid:document.createElement('canvas'),box:document.createElement('canvas')};
function layout(){
  view.cw=innerWidth;view.ch=innerHeight;view.dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(view.cw*view.dpr);cv.height=Math.round(view.ch*view.dpr);
  const cw=view.cw,ch=view.ch;
  view.land=cw>=ch*1.15;

    view.bx=(cw-view.T*COLS)/2;view.by=(ch-view.T*ROWS)/2;
    document.documentElement.style.setProperty('--pb',Math.round(clamp((view.side-18)/3,36,54))+'px');
  }else{ // 세로: 위에 지도, 아래에 버튼
    view.T=Math.max(16,Math.min((cw-16)/COLS,(ch-60-240)/ROWS));

// 바닥·테두리·바깥 꾸미기는 한 번만 그려 둬요
function seeded(n){let s=n;return()=>{s=(s*16807)%2147483647;return s/2147483647;};}
function renderBg(){
  bgDirty=false;
  const {cw,ch,dpr,T,bx,by}=view;
  bgc.width=Math.round(cw*dpr);bgc.height=Math.round(ch*dpr);
  const c=bgc.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);
  const g=c.createLinearGradient(0,0,0,ch);g.addColorStop(0,theme.bg[0]);g.addColorStop(1,theme.bg[1]);
  c.fillStyle=g;c.fillRect(0,0,cw,ch);
  const rnd=seeded(7+theme.id.length);
  for(let i=0;i<46;i++){
    const x=rnd()*cw,y=rnd()*ch,s=6+rnd()*8;
    if(x>bx-T*.5&&x<bx+T*COLS+T*.5&&y>by-T*.5&&y<by+T*ROWS+T*.5)continue;
    decoAt(c,x,y,s,rnd);
  }
  // 테두리

  c.fillStyle='rgba(60,40,80,.16)';rrect(c,bx-f,by-f+5,T*COLS+f*2,T*ROWS+f*2,f*1.6);c.fill();
  c.fillStyle=theme.edge;rrect(c,bx-f,by-f,T*COLS+f*2,T*ROWS+f*2,f*1.6);c.fill();
  // 바닥 바둑판

    c.fillStyle=theme.floor[(x+y)%2];c.fillRect(bx+x*T,by+y*T,T+.5,T+.5);
    if(rnd()<.18)floorDeco(c,bx+x*T+T*(.2+rnd()*.6),by+y*T+T*(.2+rnd()*.6),T,rnd);
  }
  c.fillStyle='rgba(255,255,255,.18)';c.fillRect(bx,by,T*COLS,T*.08);
  makeSprites();
}
function decoAt(c,x,y,s,rnd){
  if(theme.deco==='flower'){for(let k=0;k<5;k++){const a=k*TAU/5;ell(c,x+Math.cos(a)*s*.5,y+Math.sin(a)*s*.5,s*.38,s*.38,0,['#fff','#ffd1e1','#fff3a0'][Math.floor(rnd()*3)]);}ell(c,x,y,s*.3,s*.3,0,'#ffcf3d');}
  else if(theme.deco==='shell'){c.save();c.translate(x,y);c.rotate(rnd()*TAU);c.beginPath();c.moveTo(0,s*.5);for(let k=0;k<=6;k++){const a=Math.PI+k*Math.PI/6;c.lineTo(Math.cos(a)*s*.7,Math.sin(a)*s*.7);}c.closePath();c.fillStyle=['#ffb0a0','#fff0e0','#ffd0e6'][Math.floor(rnd()*3)];c.fill();c.restore();}
  else{c.strokeStyle='rgba(255,255,255,.9)';c.lineWidth=2;c.lineCap='round';for(let k=0;k<3;k++){const a=k*Math.PI/3;c.beginPath();c.moveTo(x-Math.cos(a)*s*.6,y-Math.sin(a)*s*.6);c.lineTo(x+Math.cos(a)*s*.6,y+Math.sin(a)*s*.6);c.stroke();}}
}

function drawFlames(c){

      if(!f.dx&&!f.dy){c.beginPath();c.arc(cx,cy,w*1.35,0,TAU);c.fill();continue;}
      c.lineWidth=w*2;c.lineCap='butt';c.beginPath();c.moveTo(cx-f.dx*T,cy-f.dy*T);
      if(f.tip){c.lineTo(cx,cy);c.stroke();c.beginPath();c.arc(cx,cy,w,0,TAU);c.fill();}
      else{c.lineTo(cx+f.dx*T*.5,cy+f.dy*T*.5);c.stroke();}
    }
  }
  // 반짝이는 물방울
  for(const f of game.flames)if((f.x*7+f.y*3+game.tick)%9===0)ell(c,bx+(f.x+.5+rand(-.3,.3))*T,by+(f.y+.5+rand(-.3,.3))*T,T*.05,T*.05,0,'#fff');
}
function drawBalloon(c,b){
  const {T,bx,by}=view, p=players[b.o], col=p?ANIMALS[p.animal].dark:'#4fb0ff';
  const u=1-b.t/FUSE, s=1+Math.sin(game.tick*(.15+u*.6))*(.04+u*.08);
  const flash=b.t<36&&Math.floor(b.t/4)%2===0?.45:0;
  drawBalloonShape(c,bx+(b.x+.5)*T,by+(b.y+.48)*T,T*.32*s,col,game.tick,flash);
}
function drawMapItem(c,x,y,T,k,t){
  const bob=Math.sin(t*.08)*T*.05;
  ell(c,x,y+T*.3,T*.22,T*.07,0,'rgba(60,40,80,.18)');
  c.save();c.globalAlpha=.35+.15*Math.sin(t*.1);ell(c,x,y+bob,T*.38,T*.38,0,'#fff');c.restore();
  drawItemIcon(c,x,y+bob-T*.02,T*.27,k);
}
function moodOf(p){
  if(p.out)return 'faint';
  if(p.moodT>0)return p.mood;
  if(p.trap)return p.trap<TRAP*.4?'sad':'surprised';
  if(game.state==='ready')return 'excited';
  return p.moving?'excited':'idle';
}
function drawPlayer(c,p){
  const {T,bx,by}=view, x=bx+(p.rx+.5)*T, fy=by+(p.ry+.5)*T+T*.36, r=T*.33, t=game.tick;
  if(game.teamMode){c.save();c.globalAlpha=.55;c.strokeStyle=TEAMS[p.team].color;c.lineWidth=T*.06;c.beginPath();c.ellipse(x,fy,r*1.05,r*.32,0,0,TAU);c.stroke();c.restore();}
  c.save();
  if(p.inv>0&&Math.floor(p.inv/5)%2===0)c.globalAlpha=.45;
  const mood=moodOf(p), floatY=p.trap?r*.5+Math.sin(t*.1)*r*.15:0;
  drawChar(c,x,fy-floatY,r,p.animal,{dir:p.dir,mood,t:t+p.phase*30,phase:p.phase,noShadow:!!p.trap});
  c.restore();
  if(p.trap)drawBubble(c,x,fy-floatY-r*.95,r*1.55,t,p.trap);
  if(isOnline()&&canControl(p)&&!p.trap){ // 내 캐릭터 표시
    const ty=fy-r*2.75+Math.sin(t*.12)*2;
    c.fillStyle='#fff';c.beginPath();c.moveTo(x-T*.13,ty-T*.12);c.lineTo(x+T*.13,ty-T*.12);c.lineTo(x,ty+T*.02);c.closePath();c.fill();
    c.fillStyle=ANIMALS[p.animal].dark;c.beginPath();c.moveTo(x-T*.08,ty-T*.09);c.lineTo(x+T*.08,ty-T*.09);c.lineTo(x,ty-T*.01);c.closePath();c.fill();
  }
}
function drawBubble(c,x,y,R,t,trap){
  const w=1+Math.sin(t*.15)*.04,h=1-Math.sin(t*.15)*.04;
  const g=c.createRadialGradient(x-R*.3,y-R*.35,R*.1,x,y,R);
  g.addColorStop(0,'rgba(255,255,255,.35)');g.addColorStop(.7,'rgba(140,210,255,.3)');g.addColorStop(1,'rgba(60,160,255,.6)');
  ell(c,x,y,R*w,R*h,0,g);
  c.strokeStyle='rgba(255,255,255,.85)';c.lineWidth=2;c.beginPath();c.ellipse(x,y,R*w,R*h,0,0,TAU);c.stroke();
  gloss(c,x-R*.42,y-R*.45,R*.26,R*.12,.85);
  const k=trap/TRAP;
  c.strokeStyle=k<.4?'#ff5a7a':'#ffd34d';c.lineWidth=3.5;c.lineCap='round';c.beginPath();c.arc(x,y,R+5,-Math.PI/2,-Math.PI/2+TAU*k);c.stroke();
}
function drawParts(c){
  const {T,bx,by}=view;
  for(const q of game.parts){
    const a=1-q.life/q.max, x=bx+q.x*T, y=by+q.y*T;
    c.save();c.globalAlpha=Math.min(1,a*1.6);
    if(q.k==='drop')drop(c,x,y,T*q.r*1.4,'#7fd0ff');
    else if(q.k==='chip'){c.translate(x,y);c.rotate(q.rot+q.life*.2);c.fillStyle=q.col;c.fillRect(-T*q.r,-T*q.r*.6,T*q.r*2,T*q.r*1.2);}
    else if(q.k==='heart')heart(c,x,y,T*q.r*2,'#ff6f96');
    else if(q.k==='ghost'){c.globalAlpha=a*.7;drawChar(c,x,y,T*.26,q.a,{dir:1,mood:'faint',t:game.tick,phase:0,noShadow:true});}
    c.restore();
  }
}
function drawTexts(c){
  const {T,bx,by}=view;
  c.textAlign='center';c.textBaseline='middle';
  for(const x of game.texts){
    const a=Math.min(1,(x.max-x.life)/20), sx=bx+x.x*T, sy=by+x.y*T;
    c.save();c.globalAlpha=a;c.font=Math.round(T*.5)+'px '+FONT;
    c.lineWidth=5;c.strokeStyle='#fff';c.lineJoin='round';c.strokeText(x.t,sx,sy);c.fillStyle=x.color;c.fillText(x.t,sx,sy);c.restore();
  }
}
function pill(c,x,y,w,h){c.fillStyle='rgba(255,250,240,.93)';rrect(c,x,y,w,h,h/2);c.fill();c.fillStyle='rgba(74,59,92,.12)';rrect(c,x,y+h-3,w,3,1.5);c.fill();}
function drawHud(c){
  if(game.demo)return;
  const {cw,land,side,bx,by,T}=view, me=myPlayer();
  c.textBaseline='middle';
  // 남은 시간
  const sec=Math.max(0,Math.ceil(game.time/60)), tt=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');
  let x0=12+(land?0:0), y0=10;
  const pw=land?Math.min(side-24,120):96;
  pill(c,x0,y0,pw,34);
  c.font='20px '+FONT;c.textAlign='center';c.fillStyle=sec<=30?'#ff5a7a':'#4a3b5c';
  ell(c,x0+20,y0+17,9,9,0,'#fff');c.strokeStyle='#4a3b5c';c.lineWidth=2;c.beginPath();c.arc(x0+20,y0+17,8,0,TAU);c.moveTo(x0+20,y0+17);c.lineTo(x0+20,y0+11);c.moveTo(x0+20,y0+17);c.lineTo(x0+24,y0+17);c.stroke();
  c.fillText(tt,x0+pw/2+10,y0+18);
  // 친구들 (갇힘·탈락 표시)
  const rowH=land?27:30;
  players.forEach((p,i)=>{
    let px,py,w;
    if(land){px=12;py=52+i*rowH;w=Math.min(side-24,130);}
    else{w=Math.min(110,(cw-pw-80)/players.length-6);px=x0+pw+8+i*(w+6);py=y0+2;}
    c.fillStyle=p.out?'rgba(255,250,240,.5)':'rgba(255,250,240,.85)';rrect(c,px,py,w,rowH-3,(rowH-3)/2);c.fill();
    if(game.teamMode){c.fillStyle=TEAMS[p.team].color;rrect(c,px,py,6,rowH-3,3);c.fill();}
    c.save();c.globalAlpha=p.out?.55:1;
    drawChar(c,px+16,py+rowH-6,8.5,p.animal,{dir:1,mood:p.out?'faint':p.trap?'sad':'idle',t:game.tick,phase:p.phase,noShadow:true});
    c.restore();
    c.font='14px '+FONT;c.textAlign='left';c.fillStyle=p.out?'rgba(74,59,92,.45)':'#4a3b5c';
    const tag=p.out?' 탈락':p.trap?' 갇힘!':'';
    let nm=p.name;while(nm.length>1&&c.measureText(nm+tag).width>w-36)nm=nm.slice(0,-1);
    c.fillText(nm+tag,px+30,py+(rowH-3)/2+1);
  });
  // 내 능력치
  if(me){
    const stats=[[1,me.nb],[2,me.rng],[3,me.spd+1]];
    stats.forEach(([k,v],i)=>{
      let sx,sy;
      if(land){sx=cw-side+12+(side-24-96)/2;sy=62+i*30;}
      else{sx=bx+i*84;sy=by+T*ROWS+10;}
      pill(c,sx,sy,78,26);drawItemIcon(c,sx+14,sy+13,9,k);
      c.font='17px '+FONT;c.textAlign='left';c.fillStyle='#4a3b5c';c.fillText('× '+v,sx+30,sy+14);
    });
  }
}
function render(){
  const c=ctx;
  if(bgDirty)renderBg();
  c.setTransform(1,0,0,1,0,0);c.drawImage(bgc,0,0);
  c.setTransform(view.dpr,0,0,view.dpr,0,0);
  if(!game)return;
  const {T,bx,by}=view;
  c.save();
  if(game.shake>0)c.translate(rand(-1,1)*game.shake,rand(-1,1)*game.shake);
  drawFlames(c);
  const rows=[...Array(ROWS)].map(()=>[]);
  for(const p of players)if(!p.out)rows[clamp(Math.floor(p.ry+.5),0,ROWS-1)].push(p);
  for(let y=0;y<ROWS;y++){
    for(let x=0;x<COLS;x++){
      const i=idx(x,y),px=bx+x*T,py=by+y*T;
      if(grid[i]===1)c.drawImage(spr.solid,px,py-T*.3,T,T*1.3);
      else if(grid[i]===2)c.drawImage(spr.box,px,py-T*.3,T,T*1.3);
      else if(itemG[i])drawMapItem(c,px+T/2,py+T/2,T,itemG[i],game.tick+i*7);
    }
    for(const b of game.balloons)if(b.y===y)drawBalloon(c,b);
    rows[y].sort((a,b)=>a.ry-b.ry).forEach(p=>drawPlayer(c,p));
  }
  drawParts(c);drawTexts(c);
  c.restore();
  drawHud(c);
  // 시작 전 3, 2, 1
  if(!game.demo&&(game.state==='ready'||game.state==='play'&&game.playT<45)){
    const n=game.state==='ready'?Math.ceil(game.cd/60):0, txt=n>0?String(n):'시작!';
    const k=game.state==='ready'?1-(game.cd%60)/60:game.playT/45, s=1+(1-k)*.4;
    c.save();c.globalAlpha=game.state==='ready'?1:1-k;c.textAlign='center';c.textBaseline='middle';
    c.font=Math.round(T*1.8*s)+'px '+FONT;c.lineWidth=10;c.lineJoin='round';c.strokeStyle='#fff';
    const cx=bx+T*COLS/2, cy=by+T*ROWS/2;c.strokeText(txt,cx,cy);c.fillStyle='#2f9fe6';c.fillText(txt,cx,cy);c.restore();
  }
}
const hudState={};
function syncHud(){ // 버튼 보이기 (바뀔 때만)
  const me=myPlayer(), canMove=!!me&&!me.out&&!game.demo&&(game.state==='play'||game.state==='ready');
  if(hudState.cm!==canMove){hudState.cm=canMove;document.body.classList.toggle('can-move',canMove);}
  const nd=me&&me.ndl>0&&!me.out?me.ndl:0, ready=!!(me&&me.trap&&nd);
  if(hudState.nd!==nd){hudState.nd=nd;$('#needleBtn').hidden=!nd;$('#needleNum').textContent=nd;}
  if(hudState.nr!==ready){hudState.nr=ready;$('#needleBtn').classList.toggle('ready',ready);}
}

// ---------- 화면 바꾸기 ----------
function show(id,on){$(id).hidden=!on;}
function startPlay(){
  const list=slots.filter(s=>s.type!=='none');
  if(list.length<2){$('#setupMsg').textContent='두 명 이상 있어야 놀 수 있어요. 컴퓨터 친구를 넣어 주세요.';return;}
  if(setupOpt.team&&new Set(list.map(s=>s.team)).size<2){$('#setupMsg').textContent='팀전은 두 팀 모두 한 명 이상 있어야 해요. 팀 버튼을 눌러 나눠 주세요.';return;}
  $('#setupMsg').textContent='';
  audio(); sfx.click();
  enterPlayScreen();
  newGame(list.map(s=>({...s,owner:s.type==='remote'?s.owner:'host'})),false,setupOpt.map==='random'?null:setupOpt.map);
  playMusic(theme.song);
  if(net.mode==='host'){net.conns.forEach(c=>c.lastSeen=Date.now());send(startMsg());sendSnap();}
}
function enterPlayScreen(){
  try{const el=document.documentElement;if(el.requestFullscreen&&!document.fullscreenElement)el.requestFullscreen().then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})).catch(()=>{});}catch(_){}
  try{if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(()=>{});}catch(_){}
  show('#setup',false);show('#result',false);show('#menu',false);
  document.body.classList.remove('in-menu');
  for(const k in hudState)delete hudState[k];
}
function homeOrLeave(){goHome();if(net.mode==='guest')setMode('join');}
function goHome(){
  if(net.mode==='host')send({t:'home'});
  show('#menu',false);show('#result',false);show('#setup',true);
  document.body.classList.add('in-menu');document.body.classList.remove('can-move');
  renderSlots(); demo(); playMusic('lobby');
}
function demo(){
  newGame([0,2,1,5].map(a=>({type:'normal',animal:a,name:ANIMALS[a].name})),true,setupOpt.map==='random'?null:setupOpt.map);
}
function showResult(){
  const w=game.winTeam;
  playMusic('lobby');sfx.win();
  $('#winText').style.color='';
  const mates=players.filter(q=>q.team===w);
  if(w>=0&&game.teamMode){

  }else{drawGroup($('#winAva'),players.map(q=>q.animal).slice(0,4));$('#winText').textContent='무승부!';$('#winSub').textContent='한 번 더 해 볼까요?';}
  const guest=net.mode==='guest';
  $('#againBtn').hidden=guest;
  $('#home2Btn').textContent=guest?'방 나가기':'처음 화면';
  if(guest)$('#winSub').textContent+=' 방장이 "한 판 더"를 누르면 다시 시작해요.';

// ---------- 같이하기 연결 (PeerJS: 폰끼리 직접 연결, 방 번호로 찾기) ----------
// 방장 폰이 모든 판정을 하고 상태를 1초에 20번 보내요. 친구 폰은 자기 캐릭터 위치와 버튼만 보내요.
const PEER_PREFIX='mongle-balloon-v1-';
function send(m){
  try{
    if(net.mode==='host')net.conns.forEach(c=>{if(c.open)c.send(m);});
    else if(net.mode==='guest'&&net.hostConn&&net.hostConn.open)net.hostConn.send(m);
  }catch(e){}
}
function startMsg(){
  return{t:'start',theme:theme.id,teamMode:!!game.teamMode,
    players:players.map(p=>({name:p.name,animal:p.animal,ai:p.ai,owner:p.owner,team:p.team,phase:p.phase}))};
}
function gridStr(){let s='';for(let i=0;i<NT;i++)s+=grid[i]===1?'#':grid[i]===2?'b':itemG[i]?String(itemG[i]):'.';return s;}
function sendSnap(){
  if(net.mode!=='host'||!game||game.demo||!net.conns.length){if(game)game.evq.length=0;return;}
  send({t:'s',st:game.state,cd:game.cd,tm:game.time,pt:game.playT,w:game.winTeam,g:gridStr(),
    b:game.balloons.map(b=>[b.id,b.x,b.y,b.t,b.o,b.r]),
    f:game.flames.map(f=>[f.x,f.y,f.dx,f.dy,f.tip?1:0,f.life]),
    p:players.map(p=>[Math.round(p.x*100),Math.round(p.y*100),p.dir,p.moving?1:0,p.trap,p.out?1:0,p.inv,p.nb,p.rng,p.spd,p.ndl,p.pv,p.mood,p.moodT,p.ai,p.owner]),
    ev:game.evq.splice(0)});
}
function guestStart(m){
  enterPlayScreen();askTap();
  setTheme(m.theme);
  grid=new Uint8Array(NT);itemG=new Uint8Array(NT);hidG=new Uint8Array(NT);
  players=m.players.map(q=>({...q,x:0,y:0,rx:0,ry:0,dir:1,moving:false,nb:1,rng:2,spd:0,ndl:0,trap:0,out:false,inv:0,mood:'idle',moodT:0,pv:0}));
  game={demo:false,state:'ready',cd:READY_T,time:GAME_T,tick:0,balloons:[],flames:[],bid:0,parts:[],texts:[],shake:0,
    teamMode:m.teamMode,winTeam:-1,endT:0,paused:false,evq:[],playT:0,hurry:false};
  layout();playMusic(theme.song);
}
function applySnap(s){
  if(!game||game.demo)return;
  const prevState=game.state;
  game.state=s.st==='over'?game.state:s.st;game.cd=s.cd;game.time=s.tm;game.playT=s.pt;game.winTeam=s.w;
  if(prevState==='ready'&&s.st==='play')sfx.go();
  for(let i=0;i<NT;i++){const ch=s.g[i];grid[i]=ch==='#'?1:ch==='b'?2:0;itemG[i]=ch>='1'&&ch<='4'?+ch:0;}
  game.balloons=s.b.map(a=>({id:a[0],x:a[1],y:a[2],t:a[3],o:a[4],r:a[5]}));
  game.flames=s.f.map(a=>({x:a[0],y:a[1],dx:a[2],dy:a[3],tip:!!a[4],life:a[5]}));
  s.p.forEach((a,i)=>{
    const p=players[i];if(!p)return;
    const x=a[0]/100,y=a[1]/100;
    p.ai=a[14];p.owner=a[15];
    if(canControl(p)){if(a[11]!==p.pv){p.pv=a[11];p.x=p.rx=x;p.y=p.ry=y;}}
    else{p.x=x;p.y=y;p.dir=a[2];p.moving=!!a[3];}
    p.trap=a[4];p.out=!!a[5];p.inv=a[6];p.nb=a[7];p.rng=a[8];p.spd=a[9];p.ndl=a[10];
    if(a[13]>0&&(a[12]!==p.mood||p.moodT<=0)){p.mood=a[12];p.moodT=a[13];}
  });
  (s.ev||[]).forEach(handleEvent);
}
function sendMe(){
  const p=myPlayer();if(!p||!game||game.demo)return;
  send({t:'me',i:players.indexOf(p),x:Math.round(p.x*1000)/1000,y:Math.round(p.y*1000)/1000,d:p.dir,m:p.moving?1:0});
}
// 폰이 갑자기 꺼지면 '연결 끊김' 알림이 늦게 오거나 안 와요. 5초 동안 소식이 없으면 끊긴 걸로 봐요.
function checkAlive(){
  const now=Date.now();
  if(net.mode==='host'&&game.state!=='over'){
    for(const c of net.conns.slice())if(players.some(p=>p.owner===c.peer&&p.ai==='human')&&now-(c.lastSeen||now)>5000){try{c.close();}catch(_){}hostLost(c);}
  }else if(net.mode==='guest'&&game.state!=='over'&&now-(net.lastSnap||now)>6000){
    try{if(net.hostConn)net.hostConn.close();}catch(_){}
    guestLost();
  }
}
function onData(m,conn){
  if(!m||typeof m!=='object')return;
  conn.lastSeen=Date.now();
  if(net.mode==='guest'&&(m.t==='s'||m.t==='start'))net.lastSnap=Date.now();
  if(net.mode==='host'){
    const p=game&&!game.demo&&typeof m.i==='number'?players[m.i]:null, owns=p&&p.owner===conn.peer&&p.ai==='human';
    if(m.t==='hello')hostHello(m,conn);
    else if(m.t==='me'&&owns&&!p.out){p.x=clamp(+m.x||0,0,COLS-1);p.y=clamp(+m.y||0,0,ROWS-1);p.dir=m.d===-1?-1:1;p.moving=!!m.m;}
    else if(m.t==='drop'&&owns)tryDrop(p);
    else if(m.t==='needle'&&owns)useNeedle(p);
  }else if(net.mode==='guest'){
    if(m.t==='start')guestStart(m);
    else if(m.t==='s')applySnap(m);
    else if(m.t==='over'){if(game&&!game.demo){game.state='over';game.winTeam=m.w;showResult();}}
    else if(m.t==='lobby')joinStatus('같이 하는 친구: '+m.list.map(s=>s.name+(s.type==='human'?'(방장 폰)':s.type==='remote'?'':'(컴퓨터)')).join(', '));
    else if(m.t==='home'){goHome();joinStatus('방장이 다음 판을 준비하고 있어요');}
    else if(m.t==='full')joinStatus('방이 꽉 찼어요 (5명까지)');
    else if(m.t==='busy')joinStatus('지금 놀이 중이에요. 판이 끝나면 다시 들어와요');
  }
}
function roomMsg(html){const b=$('#roomBox');b.hidden=false;b.innerHTML=html;}
function joinStatus(t){const e=$('#joinStatus');if(e)e.textContent=t;}
function noPeer(){roomMsg('<p>같이하기는 게임 주소(github.io)로 열었을 때만 돼요.<br>지금은 "이 폰 하나로"로 놀 수 있어요.</p>');}
function leaveRoom(){
  const peer=net.peer; net.peer=null;
  try{if(peer)peer.destroy();}catch(e){}
  net.conns=[];net.hostConn=null;net.code=null;net.myId='host';
  slots.forEach((s,i)=>{if(s.type==='remote')slots[i]={type:'none',animal:s.animal,name:s.name,team:s.team};});
}
function setMode(m){
  leaveRoom();
  net.mode=m==='join'?'guest':m;
  document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));
  $('#slots').classList.toggle('single',net.mode==='guest');
  $('#setupMsg').textContent='';
  if(net.mode==='local')$('#roomBox').hidden=true;
  else if(net.mode==='host')openRoom();
  else roomMsg('<p>방장 폰에 나온 <b>방 번호 4자리</b>를 넣어요</p><input id="codeIn" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="방 번호"><p id="joinStatus">아래 내 캐릭터를 고르고 "들어가기"를 눌러요</p>');
  renderSlots();
}
function openRoom(){
  if(!window.Peer){noPeer();return;}
  const code=String(Math.floor(1000+Math.random()*9000));
  roomMsg('<p>방을 만드는 중…</p>');
  let peer;
  try{peer=new Peer(PEER_PREFIX+code);}catch(e){noPeer();return;}
  net.peer=peer;
  peer.on('open',()=>{
    if(net.peer!==peer)return;
    net.code=code;
    roomMsg('<p>방 번호</p><div class="code">'+code+'</div><p>다른 폰에서 이 게임을 열고 <b>방 들어가기</b>에 이 번호를 넣어요</p><p id="hostStatus">친구를 기다리는 중…</p>');
    updateStartBtn();
  });
  peer.on('connection',conn=>{
    conn.on('open',()=>{if(net.peer===peer)net.conns.push(conn);});
    conn.on('data',m=>onData(m,conn));
    conn.on('close',()=>hostLost(conn));
  });
  peer.on('disconnected',()=>{if(net.peer===peer&&!peer.destroyed)try{peer.reconnect();}catch(_){}});
  peer.on('error',e=>{
    if(net.peer!==peer)return;
    if(e&&e.type==='unavailable-id'){net.peer=null;try{peer.destroy();}catch(_){}openRoom();return;}
    if(e&&(e.type==='peer-unavailable'||e.type==='disconnected'))return;
    if(!net.code)noPeer();
  });
}
function hostHello(m,conn){
  if($('#setup').hidden){conn.send({t:'busy'});setTimeout(()=>conn.close(),500);return;}
  if(slots.some(s=>s.type==='remote'&&s.owner===conn.peer))return;
  let i=slots.findIndex((s,k)=>k>0&&s.type==='none');                         // 빈 칸 먼저
  if(i<0)i=slots.findIndex((s,k)=>k>0&&(s.type==='easy'||s.type==='normal')); // 다음은 컴퓨터 칸
  if(i<0){conn.send({t:'full'});setTimeout(()=>conn.close(),500);return;}
  const animal=clamp(m.animal|0,0,ANIMALS.length-1), name=String(m.name||ANIMALS[animal].name).slice(0,6);
  slots[i]={type:'remote',animal,name,owner:conn.peer,team:slots[i].team|0};
  sfx.join();renderSlots();sendLobby();
}
function sendLobby(){
  const n=slots.filter(s=>s.type==='remote').length, st=$('#hostStatus');
  if(st)st.textContent=n?'친구 폰 '+n+'대가 들어왔어요':'친구를 기다리는 중…';
  send({t:'lobby',list:slots.filter(s=>s.type!=='none').map(s=>({name:s.name,animal:s.animal,type:s.type}))});
}
function hostLost(conn){
  if(!net.conns.includes(conn))return;
  net.conns=net.conns.filter(c=>c!==conn);
  const id=conn.peer;
  slots.forEach((s,i)=>{if(s.type==='remote'&&s.owner===id)slots[i]={type:'none',animal:s.animal,name:s.name,team:s.team};});
  if(game&&!game.demo&&$('#setup').hidden){
    players.forEach(p=>{
      if(p.owner!==id)return;
      p.owner='host';p.ai='easy';p.path=null;
      addText(p.name+' 폰이 나갔어요 · 컴퓨터가 대신해요',COLS/2,ROWS/2,'#9b8cff');
    });
  }else{renderSlots();sendLobby();}
}
function joinRoom(){
  if(!window.Peer){noPeer();return;}
  const inp=$('#codeIn'), code=(inp?inp.value:'').replace(/\D/g,'');
  if(code.length!==4){joinStatus('번호 4자리를 넣어 주세요');return;}
  audio();
  if(net.peer)leaveRoom();
  joinStatus('연결하는 중…');
  let peer;
  try{peer=new Peer();}catch(e){noPeer();return;}
  net.peer=peer;
  peer.on('open',id=>{
    if(net.peer!==peer)return;
    net.myId=id;
    const conn=peer.connect(PEER_PREFIX+code,{reliable:true,serialization:'json'});
    conn.on('open',()=>{
      if(net.peer!==peer)return;
      net.hostConn=conn;net.code=code;
      const me=slots[0];
      conn.send({t:'hello',name:me.name||ANIMALS[me.animal].name,animal:me.animal});
      renderSlots();joinStatus('들어왔어요! 방장이 시작하길 기다려요');
    });
    conn.on('data',m=>onData(m,conn));
    conn.on('close',()=>{if(net.hostConn===conn)guestLost();});
  });
  peer.on('error',e=>{
    if(net.peer!==peer)return;
    if(e&&e.type==='peer-unavailable'){joinStatus('그 번호의 방이 없어요. 번호를 다시 봐 주세요');net.peer=null;try{peer.destroy();}catch(_){}return;}
    if(e&&e.type==='disconnected')return;
    if(!net.hostConn)noPeer();
  });
}
function guestLost(){
  goHome();setMode('join');
  $('#setupMsg').textContent='방장 폰과 연결이 끊겼어요. 번호를 넣고 다시 들어가 주세요.';
}

$('#startBtn').onclick=()=>{if(net.mode==='guest')joinRoom();else startPlay();};
$('#againBtn').onclick=startPlay;
$('#home2Btn').onclick=homeOrLeave;
$('#homeBtn').onclick=homeOrLeave;
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{sfx.click();setMode(b.dataset.mode);});
$('#menuBtn').onclick=()=>{
  if(!game)return;
  if(!isOnline())game.paused=true;
  $('#restartBtn').hidden=net.mode==='guest';
  $('#homeBtn').textContent=net.mode==='guest'?'방 나가기':'처음 화면';
  show('#menu',true);
};
$('#resumeBtn').onclick=()=>{game.paused=false;show('#menu',false);};
$('#restartBtn').onclick=startPlay;
function soundLabel(){$('#soundBtn').textContent=muted?'소리 켜기':'소리 끄기';}
$('#soundBtn').onclick=()=>{muted=!muted;store.set('mb_muted',muted);soundLabel();sfx.click();};
soundLabel();
function renderOpts(){
  const m=THEMES.find(t=>t.id===setupOpt.map), guest=net.mode==='guest';
  $('#mapBtn').textContent='지도: '+(m?m.name:'아무거나');
  $('#teamBtn').textContent=setupOpt.team?'팀전 (딸기팀 vs 블루베리팀)':'개인전';
  $('#mapBtn').hidden=guest;$('#teamBtn').hidden=guest;
  $('#musicBtn').textContent=music.on?'음악 켜짐':'음악 꺼짐';
  $('#musicBtn2').textContent=music.on?'음악 끄기':'음악 켜기';
}
$('#mapBtn').onclick=()=>{
  const ids=['random',...THEMES.map(t=>t.id)];
  setupOpt.map=ids[(ids.indexOf(setupOpt.map)+1)%ids.length];store.set('mb_map',setupOpt.map);
  sfx.click();renderOpts();demo();
};
$('#teamBtn').onclick=()=>{setupOpt.team=!setupOpt.team;store.set('mb_team',setupOpt.team);sfx.click();renderSlots();if(net.mode==='host')sendLobby();};
$('#musicBtn').onclick=$('#musicBtn2').onclick=()=>{audio();setMusicOn(!music.on);renderOpts();};
document.addEventListener('pointerdown',()=>audio(),true); // 첫 터치에 음악이 시작돼요

addEventListener('resize',layout);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{const st=$('#setup');if(st&&!st.hidden)renderSlots();});

// ---------- 시작 ----------
layout();
document.body.classList.add('in-menu');
renderSlots();
demo();
playMusic('lobby');
// 홍보 그림 찍기용: 주소 끝에 ?shot=play 를 붙이면 꾸며 둔 놀이 장면에서 멈춰요 (?shot=icon 은 홈 화면 아이콘)
let frozen=false;
function drawIcon(c){ // 홈 화면 아이콘: 풀밭 위에서 물풍선을 든 토끼
  const g=c.createLinearGradient(0,0,0,512);g.addColorStop(0,'#c4f2b6');g.addColorStop(1,'#8fd88a');
  c.fillStyle=g;c.fillRect(0,0,512,512);
  for(let y=0;y<4;y++)for(let x=0;x<4;x++)if((x+y)%2){c.fillStyle='rgba(255,255,255,.12)';c.fillRect(x*128,y*128,128,128);}
  c.save();c.globalAlpha=.85;c.strokeStyle='#4fb0ff';c.lineCap='round';c.lineWidth=46;c.beginPath();c.moveTo(40,420);c.lineTo(472,420);c.stroke();
  c.strokeStyle='#eaf9ff';c.lineWidth=18;c.beginPath();c.moveTo(40,420);c.lineTo(472,420);c.stroke();c.restore();
  drawChar(c,190,400,112,0,{dir:1,mood:'excited',t:30,phase:0});
  drawBalloonShape(c,380,250,78,'#4fb0ff',0,0);
}
function setupShot(id){
  if(id==='icon'){
    document.body.innerHTML='';
    const c=document.createElement('canvas');c.width=c.height=512;c.style.cssText='position:fixed;left:0;top:0;width:512px;height:512px';
    document.body.appendChild(c);drawIcon(c.getContext('2d'));frozen=true;return;
  }
  slots=[0,2,1,5,4].map((a,i)=>({type:i?'normal':'human',animal:a,name:ANIMALS[a].name,team:i%2}));
  setupOpt.map=THEMES.some(t=>t.id===id)?id:'meadow';setupOpt.team=false;
  startPlay();
  game.state='play';game.playT=99;
  for(let i=0;i<500;i++){update();if(game.state!=='play')break;}
  const me=players[0];me.out=false;me.nb=3;me.rng=3;me.spd=1;
  const other=players.find(p=>p!==me&&!p.out);if(other){other.out=false;other.trap=TRAP*.6;}
  frozen=true;
}
const shotMode=new URLSearchParams(location.search).get('shot');
if(shotMode&&shotMode!=='lobby')setupShot(shotMode);
let last=performance.now(),acc=0;
function frame(now){
  acc+=Math.min(100,now-last);last=now;
  while(acc>=1000/60){if(!frozen)update();acc-=1000/60;}
  render();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__mb={get game(){return game;},get players(){return players;},get grid(){return grid;},startPlay,tryDrop,explode,net,setMode,joinRoom,setupOpt,renderSlots,get slots(){return slots;},update,layout,view};
})();
</script>
